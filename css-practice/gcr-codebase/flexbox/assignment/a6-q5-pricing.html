<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Section</title>
  <link rel="stylesheet" href="a6-q5-pricing.css">
</head>
<body>
  <section class="pricing-section">
    <div class="pricing-card card-one">
      <h2>Starter</h2>
      <p class="price">$19</p>
      <ul>
        <li>1 Project</li>
        <li>Basic Support</li>
        <li>Email Access</li>
      </ul>
    </div>

    <div class="pricing-card featured">
      <h2>Pro</h2>
      <p class="price">$49</p>
      <ul>
        <li>Unlimited Projects</li>
        <li>Priority Support</li>
        <li>Advanced Analytics</li>
      </ul>
    </div>

    <div class="pricing-card card-three">
      <h2>Business</h2>
      <p class="price">$99</p>
      <ul>
        <li>Team Access</li>
        <li>Custom Reports</li>
        <li>Dedicated Manager</li>
      </ul>
    </div>
  </section>
</body>
</html>
