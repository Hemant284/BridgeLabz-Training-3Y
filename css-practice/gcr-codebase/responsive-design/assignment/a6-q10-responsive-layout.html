<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Webpage Layout</title>
  <link rel="stylesheet" href="a6-q10-responsive-layout.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">BrandName</div>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="main-layout">
    <article class="article-content">
      <h1 class="fade-in-title">Welcome to Our Platform</h1>
      <div class="info-boxes">
        <div class="info-box">Design</div>
        <div class="info-box">Development</div>
        <div class="info-box">Support</div>
      </div>
    </article>

    <aside class="sidebar">
      <h3>Popular Topics</h3>
      <ul>
        <li>Responsive Design</li>
        <li>CSS Grid</li>
        <li>Flexbox</li>
      </ul>
    </aside>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 BrandName. All rights reserved.</p>
  </footer>
</body>
</html>
