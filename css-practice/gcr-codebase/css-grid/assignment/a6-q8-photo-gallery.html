<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="a6-q8-photo-gallery.css">
</head>
<body>
  <h1>Photo Gallery</h1>

  <div class="gallery">
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Forest trail">
      <figcaption>Forest Trail</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Mountain view">
      <figcaption>Mountain View</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake reflection">
      <figcaption>Lake Reflection</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Road through valley">
      <figcaption>Valley Road</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="River and flowers">
      <figcaption>River Flowers</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1521295121784-8a321d551ad2?auto=format&fit=crop&w=800&q=80" alt="Coconut trees">
      <figcaption>Coastal View</figcaption>
    </figure>
  </div>
</body>
</html>
