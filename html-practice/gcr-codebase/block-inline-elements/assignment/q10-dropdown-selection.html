<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Selection Page</title>
</head>
<body>
  <h1>Travel Preferences</h1>

  <label for="country">Country:</label>
  <select id="country" name="country">
    <option value="india" selected>India</option>
    <option value="france">France</option>
    <option value="japan">Japan</option>
  </select><br><br>

  <label for="state">State:</label>
  <select id="state" name="state">
    <option value="delhi" selected>Delhi</option>
    <option value="maharashtra">Maharashtra</option>
    <option value="karnataka">Karnataka</option>
  </select><br><br>

  <label for="city">City:</label>
  <select id="city" name="city">
    <option value="newdelhi" selected>New Delhi</option>
    <option value="mumbai">Mumbai</option>
    <option value="bangalore">Bangalore</option>
  </select><br><br>

  <label for="place">Favorite Tourist Place:</label>
  <select id="place" name="place">
    <option value="tajmahal" selected>Taj Mahal</option>
    <option value="eiffel">Eiffel Tower</option>
    <option value="kyoto">Kyoto Temple</option>
  </select>

  <p>You selected: India, Delhi, New Delhi, Taj Mahal.</p>
</body>
</html>
